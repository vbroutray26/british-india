name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @bi/api typecheck
      - run: pnpm --filter @bi/ui typecheck
      - run: pnpm --filter @bi/ui build-storybook
      - run: pnpm build
      - name: No inline scripts in built HTML (NFR-SEC-01)
        run: |
          if grep -rlE '<script(>| (type="module"|is:inline)[^>]*>[^<])' apps/web/dist --include=*.html; then
            echo "Inline script found"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with: { name: site, path: apps/web/dist, retention-days: 7 }

  pipeline:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: pipeline } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      - name: Validate registers (FR-MEDIA-07, TS-DATA-10)
        run: uv run python -m pipeline.validate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [web, pipeline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env: { PUBLIC_CF_BEACON_TOKEN: "${{ vars.CF_BEACON_TOKEN }}" }
      - run: pnpm --filter @bi/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
