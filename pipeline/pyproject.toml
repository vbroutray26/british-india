[project]
name = "bi-pipeline"
version = "0.1.0"
description = "Towns of British India data pipeline (spec §8)"
requires-python = ">=3.12"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "pydantic>=2.9",
  "rapidfuzz>=3.14.6",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pypdfium2>=5.15.2",
    "pytest>=8",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
