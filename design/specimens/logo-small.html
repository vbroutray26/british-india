<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Logo at small sizes</title>
<style>
body{margin:0;font:13px system-ui;background:#EFE5CF;color:#231C14;padding:20px}
.row{display:flex;gap:28px;align-items:end;flex-wrap:wrap;padding:16px;border:1px solid #B8A988;margin-bottom:14px}
.row.dark{background:#17130E;color:#EFE5CF}
.row h2{width:100%;margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.item{text-align:center} .item svg{display:block;margin:0 auto 4px}
.header{display:flex;align-items:center;justify-content:space-between;width:100%;border-bottom:1px solid #B8A988;padding:8px 0}
.tab{display:flex;align-items:center;gap:6px;background:#fff;border-radius:8px 8px 0 0;padding:6px 10px;color:#222}
</style></head><body>
<div class="row" id="lite"><h2>Lite logo (header/footer)</h2></div>
<div class="row" id="hdr"><h2>In a header (56 px tall)</h2></div>
<div class="row" id="fav"><h2>Favicon candidates: T initial · train</h2></div>
<div class="row dark" id="favd"><h2>Favicon on dark browser chrome</h2></div>
<script>
const get=f=>fetch(f).then(r=>r.text());
const put=(el,svg,h)=>{const d=document.createElement('div');d.className='item';d.innerHTML=svg+h+'px';const s=d.querySelector('svg');s.style.height=h+'px';s.style.width='auto';el.append(d);};
Promise.all(['brand_logo_lite.svg','brand_favicon_t-initial.svg','brand_favicon_train.svg'].map(get)).then(([lite,t,tr])=>{
 for(const h of [120,72,56,40]) put(document.getElementById('lite'),lite,h);
 document.getElementById('hdr').insertAdjacentHTML('beforeend',`<div class="header"><span style="height:56px;display:block">${lite.replace('<svg','<svg style="height:56px;width:auto"')}</span><span>English · ଓଡ଼ିଆ · हिन्दी</span></div>`);
 for(const el of ['fav','favd']) for(const s of [t,tr]) for(const h of [64,32,16]) put(document.getElementById(el),s,h);
 document.getElementById('fav').insertAdjacentHTML('beforeend',`<div class="tab">${t.replace('<svg','<svg style="height:16px;width:16px"')} Towns of British India</div><div class="tab">${tr.replace('<svg','<svg style="height:16px;width:16px"')} Towns of British India</div>`);
});
</script></body></html>
