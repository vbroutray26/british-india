# Subjects of chapter figures (D-39). A district gazetteer's chapters give figures for the district and
# for forests, famine tracts, estates and holdings inside it, so DP-04 links a chapter figure to a place
# only through this file. Each row is read from the sentence around the figure (quoted in `evidence`).
# A row links the one unlinked fact with this page, type and quote (as DP-04 extracts it).
# Figures not listed stay unlinked: they are in the passages and search, never on a place's fact cards.
